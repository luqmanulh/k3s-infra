apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    scrape_configs:
      - job_name: "node-exporter"
        static_configs:
          - targets: ["node-exporter.monitoring.svc:9100"]

      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
        - role: node
        relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - target_label: __address__
          replacement: kubernetes.default.svc:443
        - source_labels: [__meta_kubernetes_node_name]
          regex: (.+)
          target_label: __metrics_path__
          replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: "kubernetes-pods"
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

  alert.rules.yml: |
    groups:
      - name: k3s-node-and-cgroup-health
        rules:
          - alert: NodeHighIOPressure
            expr: rate(node_pressure_io_stalled_seconds_total{job="node-exporter"}[5m]) > 0.25
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High Disk I/O Pressure (PSI) on {{ $labels.instance }}"
              description: "Node I/O stall time has exceeded 25% over the last 5 minutes (possible cgroup page cache thrashing or disk saturation)."

          - alert: NodeHighMemoryPressure
            expr: rate(node_pressure_memory_stalled_seconds_total{job="node-exporter"}[5m]) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High Memory Pressure (PSI) on {{ $labels.instance }}"
              description: "Node memory stall time has exceeded 5% over the last 5 minutes."

          - alert: ContainerMemoryNearLimit
            expr: >
              (
                max by (namespace, pod, container) (container_memory_usage_bytes{container!="",container!="POD"})
                / on(namespace, pod, container)
                max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
              ) > 0.90
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) memory > 90% of limit"
              description: "Cgroup memory usage (anon + file page cache) is above 90% of its memory.max limit, risking page cache thrashing."

          - alert: ContainerHighMajorPageFaults
            expr: sum by (namespace, pod, container) (rate(container_memory_failures_total{container!="",container!="POD",failure_type="pgmajfault",scope="container"}[5m])) > 10
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is page-thrashing"
              description: "Container is experiencing >10 major page faults/sec for 5 minutes (binary/file page eviction loop)."

          - alert: KubernetesPodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
              description: "Container {{ $labels.container }} has restarted more than 3 times in the last 15 minutes."

          - alert: KubernetesPodNotReady
            expr: kube_pod_status_ready{condition="true"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready for >10m"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-Ready state for more than 10 minutes."

          - alert: NodeFilesystemAlmostOutOfSpace
            expr: >
              (
                node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay"}
              ) < 0.15
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} has <15% free space"
              description: "Available disk space on {{ $labels.mountpoint }} is below 15%."
