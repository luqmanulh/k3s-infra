apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
      - name: traefik
        image: docker.io/traefik:v3.7.4
        resources:
          limits:
            cpu: 200m
            memory: 384Mi
          requests:
            cpu: 50m
            memory: 128Mi
        args:
        - --configFile=/config/traefik.yml
        - --certificatesresolvers.letsencrypt.acme.email=$(TRAEFIK_ACME_EMAIL)
        envFrom:
        - secretRef:
            name: traefik-secrets
        ports:
        - containerPort: 80
          name: web
        - containerPort: 443
          name: websecure
        - containerPort: 22
          name: ssh
        - containerPort: 8080
          name: ping
        livenessProbe:
          httpGet:
            path: /ping
            port: ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ping
            port: ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: traefik-config
      - name: data
        persistentVolumeClaim:
          claimName: traefik-data
